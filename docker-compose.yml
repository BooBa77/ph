services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      - POSTGRES_DB=ph
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - ph_dev_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ph
      - JWT_ACCESS_SECRET=dev-secret-do-not-use-in-prod
      - JWT_ACCESS_EXPIRES_IN=30m
      - REFRESH_EXPIRES_DAYS=180
      - COOKIE_SECURE=false
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ph_dev_postgres_data:
  backend_node_modules:
  frontend_node_modules: