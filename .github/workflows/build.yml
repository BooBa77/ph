name: Build and Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: booba77/ph-backend
  IMAGE_FRONTEND: booba77/ph-frontend

jobs:
  # Проверки идут ДО сборки образов: если линтер, сборка или тесты падают,
  # в реестр не попадает заведомо сломанный образ, а прод не обновляется.
  # Добавлено 12.10.2026 — раньше workflow пушил образы без проверок
  # (то же самое сделано в u40ta, чтобы проекты проверялись одинаково).
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Зависимости бэкенда
        working-directory: backend
        run: npm ci

      - name: Линтер бэкенда
        working-directory: backend
        run: npm run lint

      - name: Сборка бэкенда
        working-directory: backend
        run: npm run build

      # Тесты идут с SWC: в конфиге Vitest он отключается только переменной
      # VITEST_NO_SWC, которую ставит локальный скрипт из-за песочницы DSH.
      - name: Тесты бэкенда
        working-directory: backend
        run: npm test

      - name: Зависимости фронтенда
        working-directory: frontend
        run: npm ci

      # `npm run build` на фронте включает type-check (vue-tsc), поэтому
      # отдельный шаг для проверки типов не нужен.
      - name: Сборка фронтенда
        working-directory: frontend
        run: npm run build

      - name: Тесты фронтенда
        working-directory: frontend
        run: npm test

  build:
    name: Сборка образов
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
