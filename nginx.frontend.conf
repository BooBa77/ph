server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback для Vue Router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — НЕ кэшировать, иначе PWA-обновления не подхватятся
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Скрипт регистрации SW — тоже свежий
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Манифест — свежий
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Хэшированные ассеты (js/css с хэшем в имени) — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Прочая статика (иконки, favicon, шрифты). Имена у неё не хэшированы,
    # поэтому «месяц в кэше» здесь — ловушка: после деплоя новый знак,
    # favicon или иконка приложения не появлялись бы у тех, кто заходил
    # раньше. Ставим ревалидацию: неизменённый файл отдаётся 304,
    # а изменённый — сразу новый.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}