server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Для Vue Router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}