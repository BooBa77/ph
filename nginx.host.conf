# Хостовый nginx прод-сервера PeakHunter.
#
# Это копия файла с сервера:
#   /etc/nginx/sites-available/ph.booba.fvds.ru
# включается симлинком:
#   ln -s /etc/nginx/sites-available/ph.booba.fvds.ru /etc/nginx/sites-enabled/
#
# Роль: терминирует TLS и разводит трафик между контейнерами.
#   /      -> фронтенд-контейнер (127.0.0.1:8081) — статика и SPA-fallback
#   /api/  -> бэкенд-контейнер    (127.0.0.1:3001)
#
# Отсюда важное следствие: в образе фронтенда (nginx.frontend.conf)
# прокси на /api НЕТ и не должно быть — запросы к API до этого nginx
# не доходят, их забирает вот этот конфиг. Отсутствие /api в
# nginx.frontend.conf — не баг, а разделение ролей.
#
# Сертификаты — Let's Encrypt, продлеваются certbot. Проверка конфига
# после правок: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ph.booba.fvds.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ph.booba.fvds.ru;

    ssl_certificate /etc/letsencrypt/live/ph.booba.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ph.booba.fvds.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живой поток вкладки «Снаряжение» (SSE, 06.11.2026).
    #
    # Обычный прокси-буфер копит кадры и отдаёт их пачками — «онлайн»
    # приезжает с задержкой в размер буфера или не приезжает вовсе.
    # Бэкенд уже ставит `X-Accel-Buffering: no`, но здесь это видно
    # в конфиге, а не в коде: тот, кто будет читать сервер, должен
    # понимать, почему у одного ответа выключен буфер.
    #
    # `proxy_read_timeout 1h` — поток живёт, пока открыта вкладка;
    # дефолтных 60 секунд хватило бы, только пока идут события, а тихая
    # вкладка с паузой в разговоре закрывалась бы каждую минуту.
    location ~ ^/api/trips/[0-9]+/gear/events$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
