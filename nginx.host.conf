# Хостовый nginx прод-сервера PeakHunter.
#
# Это копия файла с сервера:
#   /etc/nginx/sites-available/ph.booba.fvds.ru
# включается симлинком:
#   ln -s /etc/nginx/sites-available/ph.booba.fvds.ru /etc/nginx/sites-enabled/
#
# Роль: терминирует TLS и разводит трафик между контейнерами.
#   /      -> фронтенд-контейнер (127.0.0.1:8081) — статика и SPA-fallback
#   /api/  -> бэкенд-контейнер    (127.0.0.1:3001)
#
# Отсюда важное следствие: в образе фронтенда (nginx.frontend.conf)
# прокси на /api НЕТ и не должно быть — запросы к API до этого nginx
# не доходят, их забирает вот этот конфиг. Отсутствие /api в
# nginx.frontend.conf — не баг, а разделение ролей.
#
# Сертификаты — Let's Encrypt, продлеваются certbot. Проверка конфига
# после правок: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ph.booba.fvds.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ph.booba.fvds.ru;

    ssl_certificate /etc/letsencrypt/live/ph.booba.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ph.booba.fvds.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
